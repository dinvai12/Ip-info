<script>
const API_URL = "/api";

const card = document.getElementById("infoCard");
const input = document.getElementById("ipInput");
const clearBtn = document.getElementById("clearBtn");

function showData(data) {

  if (data.error) {
    card.innerHTML = `
      <div class="error">
        ${data.message || "IP lookup failed"}
      </div>
    `;
    return;
  }

  const asn = data.asn
    ? "AS" + String(data.asn).replace(/^AS/i, "")
    : "Unknown";

  card.innerHTML = `
    <div class="section-title">
      IP Information
    </div>

    <div class="row">
      <span class="label">IP Address</span>
      <span class="value ip">${data.ip || "Unknown"}</span>
    </div>

    <div class="row">
      <span class="label">Country</span>
      <span class="value">${data.country || "Unknown"}</span>
    </div>

    <div class="row">
      <span class="label">City</span>
      <span class="value">${data.city || "Unknown"}</span>
    </div>

    <div class="row">
      <span class="label">Region</span>
      <span class="value">${data.region || "Unknown"}</span>
    </div>

    <div class="row">
      <span class="label">Postal Code</span>
      <span class="value">${data.postal || "Unknown"}</span>
    </div>

    <div class="row">
      <span class="label">Timezone</span>
      <span class="value">${data.timezone || "Unknown"}</span>
    </div>

    <div class="row">
      <span class="label">Latitude</span>
      <span class="value">${data.latitude ?? "Unknown"}</span>
    </div>

    <div class="row">
      <span class="label">Longitude</span>
      <span class="value">${data.longitude ?? "Unknown"}</span>
    </div>

    <div class="section-title">
      Network / ASN Details
    </div>

    <div class="row">
      <span class="label">ASN</span>
      <span class="value asn">${asn}</span>
    </div>

    <div class="row">
      <span class="label">Network / Organization</span>
      <span class="value">${data.isp || "Unknown"}</span>
    </div>

    <div class="row">
      <span class="label">Cloudflare Location</span>
      <span class="value">${data.colo || "N/A"}</span>
    </div>
  `;
}


// নিজের IP load
async function loadMyIP() {

  card.innerHTML = `
    <div class="status">
      Loading your network information...
    </div>
  `;

  clearBtn.style.display = "none";
  input.value = "";

  try {

    const response = await fetch("/api", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("API request failed");
    }

    const data = await response.json();

    showData(data);

  } catch (error) {

    card.innerHTML = `
      <div class="error">
        Unable to load network information.
        <br>
        Please refresh and try again.
      </div>
    `;

    console.error(error);
  }
}


// অন্য IP search
async function searchIP() {

  const ip = input.value.trim();

  if (!ip) {
    card.innerHTML = `
      <div class="error">
        Please enter an IP address.
      </div>
    `;
    return;
  }

  card.innerHTML = `
    <div class="status">
      Searching ${ip}...
    </div>
  `;

  clearBtn.style.display = "block";

  try {

    const response = await fetch(
      "/api?ip=" + encodeURIComponent(ip),
      {
        cache: "no-store"
      }
    );

    const data = await response.json();

    if (!response.ok || data.error) {
      throw new Error(data.message || "IP lookup failed");
    }

    showData(data);

  } catch (error) {

    card.innerHTML = `
      <div class="error">
        ${error.message}
      </div>
    `;

    console.error(error);
  }
}


// Enter চাপলে search
input.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    searchIP();
  }

});


// প্রথমে নিজের IP দেখাবে
loadMyIP();
  </script>
