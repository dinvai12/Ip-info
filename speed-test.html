<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Internet Speed Test - DINUU IP INFO</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#07111f;color:#fff;font-family:Arial,sans-serif;padding:18px}
.wrap{max-width:900px;margin:auto}
.back{display:inline-block;color:#cbd5e1;text-decoration:none;margin:8px 0 20px}
h1{text-align:center;margin:8px 0}.sub{text-align:center;color:#94a3b8;margin-bottom:22px}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:12px;overflow:hidden}
.frame{width:100%;min-height:520px}
iframe{width:100%;height:520px;border:0;border-radius:14px}
.note{text-align:center;color:#8291a5;font-size:12px;margin:14px 4px 0}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Back to DINUU IP INFO</a>
  <h1>Internet Speed Test</h1>
  <div class="sub">Test your connection without leaving DINUU IP INFO</div>
  <div class="card">
    <div class="frame">
      <iframe src="https://openspeedtest.com/speedtest"
        title="OpenSpeedTest" loading="lazy" allow="fullscreen"></iframe>
    </div>
  </div>
  <div class="note">Speed test provided by OpenSpeedTest. Results can vary with device, Wi‑Fi/mobile network, ISP routing and server conditions.</div>
</div>
</body>
</html>
