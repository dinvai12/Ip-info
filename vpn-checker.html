<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VPN Checker - DINUU IP INFO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#eef2ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:auto;padding:28px 18px 50px}
a{color:#67e8f9;text-decoration:none}
.back{display:inline-block;margin-bottom:24px;padding:10px 14px;border:1px solid #263247;border-radius:12px;background:#111a2a}
.card{padding:22px;border:1px solid #263247;border-radius:20px;background:#101827;box-shadow:0 12px 40px rgba(0,0,0,.18)}
h1{margin:0 0 8px;font-size:28px}.sub{opacity:.65;margin-bottom:22px}
button{border:0;border-radius:13px;padding:13px 18px;background:#16d5ed;color:#061018;font-weight:700;cursor:pointer;width:100%}
button:disabled{opacity:.55}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:18px}
.item{padding:13px;border-radius:12px;background:#0b1321;border:1px solid #202c40}
.label{font-size:12px;opacity:.6;margin-bottom:5px}.value{font-weight:650;word-break:break-word}
.status{font-size:22px;font-weight:800;margin-top:20px;text-align:center}
.small{font-size:12px;opacity:.55;margin-top:16px;line-height:1.5;text-align:center}
</style>
</head>
<body>
<main class="wrap">
<a class="back" href="/">← Back to DINUU IP INFO</a>
<div class="card">
<h1>🛡️ VPN Checker</h1>
<div class="sub">6-source VPN detection • unavailable sources are not counted as No VPN</div>
<button id="check">Check My VPN</button>
<div id="status" class="status">Ready</div>
<div id="grid" class="grid"></div>
<div class="small">Hosting/datacenter alone is not treated as a VPN.</div>
</div>
</main>

<script>
const btn=document.getElementById('check');
const status=document.getElementById('status');
const grid=document.getElementById('grid');

const sourceNames = {
  iplogs: "IPLogs",
  ip99: "IP99",
  vpnapi: "VPNAPI.io",
  scamalytics: "Scamalytics",
  iphub: "IPHub",
  vpndetection: "VPNDetection.io"
};

function esc(v){
  return String(v ?? '—').replace(/[&<>\"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function row(a,b){
  return `<div class="item"><div class="label">${esc(a)}</div><div class="value">${esc(b)}</div></div>`;
}

function sourceRow(key, value){
  const isVPN = value === "VPN";
  const unavailable = value === "Unavailable";
  const icon = isVPN ? "🔴" : unavailable ? "🟡" : "🟢";
  return row(icon + " " + (sourceNames[key] || key), value);
}

btn.onclick=async()=>{
  btn.disabled=true;
  status.textContent='Checking…';
  grid.innerHTML='';
  try{
    const r=await fetch('/api?vpn=1',{cache:'no-store'});
    const d=await r.json();
    if(!r.ok||d.error) throw new Error(d.message||'VPN check failed');

    status.textContent =
      d.status==='detected' ? 'VPN Detected' :
      d.status==='possible' ? 'Possible VPN' :
      'No VPN Detected';

    const sources = d.sources || {};
    grid.innerHTML =
      row('IP',d.ip)+
      row('VPN Signals',`${d.detected_sources || 0}/${d.checked_sources || 0} checked sources`)+
      row('Sources Checked',`${d.checked_sources || 0}/${d.total_sources || 6}`)+
      sourceRow('iplogs',sources.iplogs)+
      sourceRow('ip99',sources.ip99)+
      sourceRow('vpnapi',sources.vpnapi)+
      sourceRow('scamalytics',sources.scamalytics)+
      sourceRow('iphub',sources.iphub)+
      sourceRow('vpndetection',sources.vpndetection)+
      row('Signals',d.signals?.join(', ')||'None');
  }catch(e){
    status.textContent=e.message||'Check failed';
  }
  btn.disabled=false;
};
</script>
</body>
</html>
